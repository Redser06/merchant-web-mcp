name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Linter Check (Oxlint)
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Run Test Suite
        if: ${{ !cancelled() }}
        run: bun test

      - name: TypeScript Typecheck & Build
        if: ${{ !cancelled() }}
        run: bun run build

      - name: Bundle leak check
        if: ${{ !cancelled() }}
        env:
          BUNDLE_LEAK_SENTINEL: SENTINEL_LEAK_9f3a
        run: bash scripts/check-bundle-leak.sh
