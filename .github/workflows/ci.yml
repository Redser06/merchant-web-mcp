name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Linter Check (Oxlint)
        run: bun run lint

      - name: TypeScript Typecheck & Build
        run: bun run build

      - name: Run Test Suite
        run: bun test
